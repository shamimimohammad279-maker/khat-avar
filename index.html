<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>خط‌آور | استودیو تایپوگرافی فارسی</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: {
                            light: 'rgba(255, 255, 255, 0.65)',
                            dark: 'rgba(18, 20, 29, 0.75)',
                            borderLight: 'rgba(255, 255, 255, 0.4)',
                            borderDark: 'rgba(255, 255, 255, 0.1)',
                            accent: '#6366f1',
                            accentHover: '#4f46e5'
                        }
                    },
                    backdropBlur: {
                        xs: '2px',
                        glass: '16px',
                    },
                    fontFamily: {
                        vazir: ['Vazirmatn', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts for Persian Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Lalezar&family=Lateef:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&family=Sahel:wght@400;700&family=Scheherazade+New:wght@400;700&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet">

    <!-- React, ReactDOM & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Base typography & glass aesthetics */
        body {
            font-family: 'Vazirmatn', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            touch-action: manipulation;
        }

        /* Glassmorphism utility classes */
        .glass-panel-light {
            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.05);
        }

        .glass-panel-dark {
            background: rgba(17, 22, 34, 0.85);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 50px -10px rgba(0, 0, 0, 0.4);
        }

        .glass-card-light {
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .glass-card-dark {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Bottom Sheet Slide Animation */
        .bottom-sheet-transition {
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 150, 150, 0.3);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(150, 150, 150, 0.5);
        }

        /* Canvas Grid Pattern */
        .workspace-bg-dark {
            background-color: #0b0d14;
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .workspace-bg-light {
            background-color: #f1f3f9;
            background-image: radial-gradient(rgba(0, 0, 0, 0.08) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        /* Ambient Glow Blobs */
        .ambient-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }

        /* Artboard Checkered Pattern for Transparency */
        .checkered-pattern {
            background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #e5e7eb 75%), 
                              linear-gradient(-45deg, transparent 75%, #e5e7eb 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
        }
        .dark .checkered-pattern {
            background-image: linear-gradient(45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(-45deg, #1f2937 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1f2937 75%), 
                              linear-gradient(-45deg, transparent 75%, #1f2937 75%);
        }

        /* Inline Text Caret & Editor overlay */
        .inline-text-editor {
            user-select: text !important;
            -webkit-user-select: text !important;
            resize: none;
            outline: none;
            background: rgba(99, 102, 241, 0.08);
            border: 2px dashed #6366f1;
            border-radius: 6px;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15);
            padding: 4px 8px;
            min-width: 100px;
        }
    </style>
</head>
<body class="h-screen w-screen m-0 p-0 overflow-hidden select-none bg-slate-900 text-slate-100 transition-colors duration-300">
    <div id="root" class="h-full w-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const BUILTIN_FONTS = [
            { name: 'وزیر متن (Vazirmatn)', family: 'Vazirmatn' },
            { name: 'لاله‌زار (Lalezar)', family: 'Lalezar' },
            { name: 'ساحل (Sahel)', family: 'Sahel' },
            { name: 'امیری (Amiri)', family: 'Amiri' },
            { name: 'لطیف (Lateef)', family: 'Lateef' },
            { name: 'نسخ نوتو (Noto Naskh)', family: 'Noto Naskh Arabic' },
            { name: 'کوفی ریم (Reem Kufi)', family: 'Reem Kufi' },
            { name: 'شهرزاد (Scheherazade)', family: 'Scheherazade New' },
        ];

        const ARTBOARD_PRESETS = [
            { label: 'پست اینستاگرام (1080 × 1080)', w: 1080, h: 1080 },
            { label: 'استوری اینستاگرام (1080 × 1920)', w: 1080, h: 1920 },
            { label: 'کاور تلگرام / توییتر (1200 × 628)', w: 1200, h: 628 },
            { label: 'کاور یوتیوب (1280 × 720)', w: 1280, h: 720 },
            { label: 'پوستر A4 (1240 × 1754)', w: 1240, h: 1754 },
            { label: 'بنر وب (1920 × 1080)', w: 1920, h: 1080 },
            { label: 'سفارشی', w: null, h: null }
        ];

        const dbStore = {
            db: null,
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('KhatAvarDB', 1);
                    request.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains('projects')) {
                            db.createObjectStore('projects', { keyPath: 'id' });
                        }
                        if (!db.objectStoreNames.contains('customFonts')) {
                            db.createObjectStore('customFonts', { keyPath: 'id' });
                        }
                    };
                    request.onsuccess = (e) => {
                        this.db = e.target.result;
                        resolve(this.db);
                    };
                    request.onerror = (e) => reject(e);
                });
            },
            async saveProject(project) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('projects', 'readwrite');
                    const store = tx.objectStore('projects');
                    const req = store.put({ ...project, updatedAt: Date.now() });
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e);
                });
            },
            async getProjects() {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('projects', 'readonly');
                    const store = tx.objectStore('projects');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e);
                });
            },
            async deleteProject(id) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('projects', 'readwrite');
                    const store = tx.objectStore('projects');
                    const req = store.delete(id);
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e);
                });
            },
            async saveCustomFont(font) {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('customFonts', 'readwrite');
                    const store = tx.objectStore('customFonts');
                    const req = store.put(font);
                    req.onsuccess = () => resolve();
                    req.onerror = (e) => reject(e);
                });
            },
            async getCustomFonts() {
                if (!this.db) await this.init();
                return new Promise((resolve, reject) => {
                    const tx = this.db.transaction('customFonts', 'readonly');
                    const store = tx.objectStore('customFonts');
                    const req = store.getAll();
                    req.onsuccess = () => resolve(req.result || []);
                    req.onerror = (e) => reject(e);
                });
            }
        };

        function App() {
            // ... existing state definitions ...
            const [theme, setTheme] = useState(() => localStorage.getItem('khatavar_theme') || 'system');
            const [isDarkMode, setIsDarkMode] = useState(true);

            // ... existing theme effect ...
            useEffect(() => {
                const root = document.documentElement;
                const applyDark = (dark) => {
                    setIsDarkMode(dark);
                    if (dark) {
                        root.classList.add('dark');
                    } else {
                        root.classList.remove('dark');
                    }
                };

                if (theme === 'system') {
                    const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                    applyDark(systemDark);

                    const listener = (e) => applyDark(e.matches);
                    const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');
                    mediaQuery.addEventListener('change', listener);
                    return () => mediaQuery.removeEventListener('change', listener);
                } else {
                    applyDark(theme === 'dark');
                }
                localStorage.setItem('khatavar_theme', theme);
            }, [theme]);

            // --- PROJECT & ARTBOARD STATE ---
            const [projectId, setProjectId] = useState(() => 'proj_' + Date.now());
            const [projectName, setProjectName] = useState('طرح تایپوگرافی جدید');
            const [artboard, setArtboard] = useState({
                width: 1080,
                height: 1080,
                bgType: 'color',
                bgColor: '#0f172a',
                bgGradient: 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%)',
                bgImage: null,
                presetIndex: 0
            });

            // --- LAYERS & EDITOR STATE ---
            const [layers, setLayers] = useState([
                {
                    id: 'layer_1',
                    name: 'متن اصلی',
                    type: 'text',
                    text: 'خط‌آور استودیو تایپوگرافی',
                    x: 540,
                    y: 480,
                    rotation: 0,
                    scaleX: 1,
                    scaleY: 1,
                    opacity: 1,
                    visible: true,
                    locked: false,
                    fontFamily: 'Lalezar',
                    fontSize: 72,
                    fontWeight: '700',
                    color: '#f8fafc',
                    align: 'center',
                    lineHeight: 1.2,
                    letterSpacing: 0,
                    runs: [],
                    charOverrides: {}
                },
                {
                    id: 'layer_2',
                    name: 'زیرعنوان',
                    type: 'text',
                    text: 'طراحی حرفه‌ای و آزاد در مرورگر',
                    x: 540,
                    y: 620,
                    rotation: 0,
                    scaleX: 1,
                    scaleY: 1,
                    opacity: 0.9,
                    visible: true,
                    locked: false,
                    fontFamily: 'Vazirmatn',
                    fontSize: 28,
                    fontWeight: '400',
                    color: '#cbd5e1',
                    align: 'center',
                    lineHeight: 1.4,
                    letterSpacing: 1,
                    runs: [],
                    charOverrides: {}
                }
            ]);

            const [selectedLayerId, setSelectedLayerId] = useState('layer_1');
            const [editorMode, setEditorMode] = useState('layer'); // 'layer' | 'text_edit' | 'character'
            const [textSelectionRange, setTextSelectionRange] = useState({ start: 0, end: 0 });
            const [selectedCharIndex, setSelectedCharIndex] = useState(null);
            const [selectedWordData, setSelectedWordData] = useState(null); // { word, startIndex, properties }
            const [selectedCharData, setSelectedCharData] = useState(null); // { char, index, properties }
            // --- DAY 1 UX ENHANCEMENTS: INLINE EDITING & MOBILE BOTTOM SHEET ---
            const [isEditingInline, setIsEditingInline] = useState(false);
            const [bottomSheetOpen, setBottomSheetOpen] = useState(true);
            const [bottomSheetTab, setBottomSheetTab] = useState('tools'); // 'tools' | 'layers' | 'artboard'
            const inlineInputRef = useRef(null);
            const lastTapRef = useRef({ time: 0, layerId: null });

            // --- FONT MANAGEMENT ---
            const [customFonts, setCustomFonts] = useState([]);
            const fontList = useMemo(() => [...BUILTIN_FONTS, ...customFonts], [customFonts]);

            // --- VIEWPORT & ZOOM STATE ---
            const [zoom, setZoom] = useState(0.6);
            const [pan, setPan] = useState({ x: 0, y: 0 });
            const workspaceRef = useRef(null);
            const artboardRef = useRef(null);

            // --- HISTORY (UNDO/REDO) ---
            const [history, setHistory] = useState([]);
            const [historyIndex, setHistoryIndex] = useState(-1);
            const isPushingHistory = useRef(false);

            // --- NOTIFICATION TOASTS & MODALS ---
            const [toast, setToast] = useState(null);
            const [showProjectsModal, setShowProjectsModal] = useState(false);
            const [savedProjectsList, setSavedProjectsList] = useState([]);
            const [showExportModal, setShowExportModal] = useState(false);

            const showToastMessage = (msg, type = 'info') => {
                setToast({ msg, type });
                setTimeout(() => setToast(null), 3000);
            };

            // Calculate auto-fit zoom for Artboard (Mobile Aware)
            const calculateFitZoom = useCallback(() => {
                if (!workspaceRef.current) return;
                const rect = workspaceRef.current.getBoundingClientRect();
                const isMobileView = window.innerWidth < 768;
                const availableW = rect.width - (isMobileView ? 24 : 120);
                const availableH = rect.height - (isMobileView ? 160 : 120);

                const scaleX = availableW / artboard.width;
                const scaleY = availableH / artboard.height;
                const fitScale = Math.min(scaleX, scaleY, 1.5);

                setZoom(Math.max(0.12, Math.round(fitScale * 100) / 100));
                setPan({ x: 0, y: 0 });
            }, [artboard.width, artboard.height]);

            useEffect(() => {
                calculateFitZoom();
            }, [artboard.width, artboard.height, calculateFitZoom]);

            // Auto-focus inline input when State 2 (Inline Text Editing) is engaged
            useEffect(() => {
                if (isEditingInline && inlineInputRef.current) {
                    inlineInputRef.current.focus();
                    const len = inlineInputRef.current.value.length;
                    inlineInputRef.current.setSelectionRange(len, len);
                }
            }, [isEditingInline]);

            // ... existing saveHistoryState, handleUndo, handleRedo, IndexedDB functions ...
            const saveHistoryState = useCallback((newLayers, newArtboard) => {
                if (isPushingHistory.current) return;
                const stateSnapshot = {
                    layers: JSON.parse(JSON.stringify(newLayers || layers)),
                    artboard: JSON.parse(JSON.stringify(newArtboard || artboard))
                };

                setHistory(prev => {
                    const sliced = prev.slice(0, historyIndex + 1);
                    return [...sliced, stateSnapshot].slice(-30);
                });
                setHistoryIndex(prev => Math.min(prev + 1, 29));
            }, [layers, artboard, historyIndex]);

            const handleUndo = useCallback(() => {
                if (historyIndex > 0) {
                    isPushingHistory.current = true;
                    const prevSnap = history[historyIndex - 1];
                    setLayers(prevSnap.layers);
                    setArtboard(prevSnap.artboard);
                    setHistoryIndex(historyIndex - 1);
                    setTimeout(() => { isPushingHistory.current = false; }, 50);
                    showToastMessage('بازگردانی (Undo) انجام شد');
                }
            }, [history, historyIndex]);

            const handleRedo = useCallback(() => {
                if (historyIndex < history.length - 1) {
                    isPushingHistory.current = true;
                    const nextSnap = history[historyIndex + 1];
                    setLayers(nextSnap.layers);
                    setArtboard(nextSnap.artboard);
                    setHistoryIndex(historyIndex + 1);
                    setTimeout(() => { isPushingHistory.current = false; }, 50);
                    showToastMessage('انجام مجدد (Redo) انجام شد');
                }
            }, [history, historyIndex]);

            useEffect(() => {
                async function loadStorageData() {
                    try {
                        await dbStore.init();
                        const fonts = await dbStore.getCustomFonts();
                        if (fonts && fonts.length > 0) {
                            for (const font of fonts) {
                                try {
                                    const fontFace = new FontFace(font.family, font.buffer);
                                    await fontFace.load();
                                    document.fonts.add(fontFace);
                                } catch (err) {
                                    console.error('Error loading font:', font.family, err);
                                }
                            }
                            setCustomFonts(fonts.map(f => ({ name: f.name, family: f.family, custom: true })));
                        }
                    } catch (e) {
                        console.error('Failed to init storage', e);
                    }
                }
                loadStorageData();
            }, []);

            const handleFontUpload = async (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                const fontName = file.name.replace(/\.[^/.]+$/, '');
                const familyName = 'CustomFont_' + Date.now();

                try {
                    const buffer = await file.arrayBuffer();
                    const fontFace = new FontFace(familyName, buffer);
                    await fontFace.load();
                    document.fonts.add(fontFace);

                    const newFont = { id: familyName, name: fontName + ' (سفارشی)', family: familyName, buffer };
                    await dbStore.saveCustomFont(newFont);
                    setCustomFonts(prev => [...prev, { name: newFont.name, family: familyName, custom: true }]);
                    showToastMessage(`فونت "${fontName}" با موفقیت نصب و ذخیره شد.`, 'success');
                } catch (err) {
                    showToastMessage('فایل فونت معتبر نیست یا پشتیبانی نمی‌شود.', 'error');
                }
            };

            // Keyboard Shortcuts Listener
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) || isEditingInline) {
                        if (e.key === 'Escape') {
                            setIsEditingInline(false);
                        }
                        return;
                    }

                    if ((e.metaKey || e.ctrlKey) && e.key === 'z') {
                        e.preventDefault();
                        if (e.shiftKey) handleRedo();
                        else handleUndo();
                    } else if ((e.metaKey || e.ctrlKey) && e.key === 's') {
                        e.preventDefault();
                        saveCurrentProject();
                    } else if ((e.key === 'Delete' || e.key === 'Backspace') && editorMode === 'layer') {
                        if (selectedLayerId) {
                            deleteSelectedLayer();
                        }
                    } else if ((e.metaKey || e.ctrlKey) && e.key === 'd') {
                        e.preventDefault();
                        duplicateSelectedLayer();
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedLayerId, editorMode, isEditingInline, handleUndo, handleRedo]);

            const activeLayer = useMemo(() => layers.find(l => l.id === selectedLayerId), [layers, selectedLayerId]);

            const updateActiveLayer = (updates) => {
                setLayers(prev => {
                    const next = prev.map(l => l.id === selectedLayerId ? { ...l, ...updates } : l);
                    saveHistoryState(next, artboard);
                    return next;
                });
            };

            const addTextLayer = () => {
                const newId = 'layer_' + Date.now();
                const newLayer = {
                    id: newId,
                    name: 'متن جدید ' + (layers.length + 1),
                    type: 'text',
                    text: 'عنوان جدید تایپوگرافی',
                    x: artboard.width / 2,
                    y: artboard.height / 2,
                    rotation: 0,
                    scaleX: 1,
                    scaleY: 1,
                    opacity: 1,
                    visible: true,
                    locked: false,
                    fontFamily: 'Vazirmatn',
                    fontSize: 60,
                    fontWeight: '700',
                    color: isDarkMode ? '#ffffff' : '#0f172a',
                    align: 'center',
                    lineHeight: 1.2,
                    letterSpacing: 0,
                    runs: [],
                    charOverrides: {}
                };
                const nextLayers = [...layers, newLayer];
                setLayers(nextLayers);
                setSelectedLayerId(newId);
                setIsEditingInline(false);
                saveHistoryState(nextLayers, artboard);
                showToastMessage('لایه متنی جدید اضافه شد');
            };

            const duplicateSelectedLayer = () => {
                if (!activeLayer) return;
                const dupId = 'layer_' + Date.now();
                const dup = {
                    ...JSON.parse(JSON.stringify(activeLayer)),
                    id: dupId,
                    name: activeLayer.name + ' (کپی)',
                    x: activeLayer.x + 30,
                    y: activeLayer.y + 30
                };
                const nextLayers = [...layers, dup];
                setLayers(nextLayers);
                setSelectedLayerId(dupId);
                saveHistoryState(nextLayers, artboard);
                showToastMessage('لایه تکثیر شد');
            };

            const deleteSelectedLayer = () => {
                if (!activeLayer) return;
                const nextLayers = layers.filter(l => l.id !== selectedLayerId);
                setLayers(nextLayers);
                setSelectedLayerId(nextLayers.length > 0 ? nextLayers[nextLayers.length - 1].id : null);
                setIsEditingInline(false);
                saveHistoryState(nextLayers, artboard);
                showToastMessage('لایه حذف شد');
            };

            const moveLayerOrder = (direction) => {
                const index = layers.findIndex(l => l.id === selectedLayerId);
                if (index === -1) return;
                const targetIndex = direction === 'up' ? index + 1 : index - 1;
                if (targetIndex < 0 || targetIndex >= layers.length) return;

                const nextLayers = [...layers];
                const temp = nextLayers[index];
                nextLayers[index] = nextLayers[targetIndex];
                nextLayers[targetIndex] = temp;

                setLayers(nextLayers);
                saveHistoryState(nextLayers, artboard);
            };

            const applyRangeFormatting = (styleKey, value) => {
                if (!activeLayer || editorMode !== 'text_edit') return;
                const { start, end } = textSelectionRange;
                if (start === end) {
                    showToastMessage('لطفاً ابتدا بخشی از متن یا یک کلمه را انتخاب کنید', 'info');
                    return;
                }

                let currentRuns = [...(activeLayer.runs || [])];
                currentRuns.push({
                    start,
                    end,
                    [styleKey]: value
                });

                updateActiveLayer({ runs: currentRuns });
                showToastMessage('فرمت روی محدوده انتخابی اعمال شد');
            };

          const selectWordAtIndex = (wordText, startIndex) => {
    setTextSelectionRange({ start: startIndex, end: startIndex + wordText.length });
    // جدید: ذخیره داده‌های کلمه
    const overrides = getWordOverrides(startIndex, wordText.length);
    setSelectedWordData({
        word: wordText,
        startIndex,
        length: wordText.length,
        properties: overrides
    });
};
const getWordOverrides = (wordStartIndex, wordLength) => {
    if (!activeLayer.charOverrides) return {};
    let merged = {};
    for (let i = wordStartIndex; i < wordStartIndex + wordLength; i++) {
        if (activeLayer.charOverrides[i]) {
            merged = { ...merged, ...activeLayer.charOverrides[i] };
        }
    }
    return merged;

};

const updateWordOverrides = (wordStartIndex, wordLength, updates) => {

const updateCharOverrides = (charIndex, updates) => {

            const handleFitToContent = (padding = 60) => {

                    return;

                let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

                visibleLayers.forEach(l => {
                    const lines = (l.text || '').split('\n');
                    const maxLineLen = Math.max(...lines.map(line => line.length), 1);
                    const estWidth = (maxLineLen * l.fontSize * 0.6) * Math.abs(l.scaleX);
                    const estHeight = (lines.length * l.fontSize * (l.lineHeight || 1.2)) * Math.abs(l.scaleY);

                    const left = l.x - (l.align === 'center' ? estWidth / 2 : l.align === 'right' ? estWidth : 0);
                    const right = left + estWidth;
                    const top = l.y - estHeight / 2;
                    const bottom = top + estHeight;

                    if (left < minX) minX = left;
                    if (right > maxX) maxX = right;
                    if (top < minY) minY = top;
                    if (bottom > maxY) maxY = bottom;
                });

                if (minX === Infinity) return;

                const contentW = Math.max(200, Math.ceil(maxX - minX + padding * 2));
                const contentH = Math.max(200, Math.ceil(maxY - minY + padding * 2));

                const shiftX = padding - minX;
                const shiftY = padding - minY;

                const nextLayers = layers.map(l => {
                    if (!l.visible) return l;
                    return {
                        ...l,
                        x: Math.round(l.x + shiftX),
                        y: Math.round(l.y + shiftY)
                    };
                });

                const nextArtboard = {
                    ...artboard,
                    width: contentW,
                    height: contentH,
                    presetIndex: 6
                };

                setArtboard(nextArtboard);

            const exportDesign = async (format, multiplier = 1) => {
                const targetW = artboard.width * multiplier;
                const targetH = artboard.height * multiplier;

                if (format === 'svg') {
                    let svgContent = `<svg xmlns="http://www.w3.org/2000/svg" width="${artboard.width}" height="${artboard.height}" viewBox="0 0 ${artboard.width} ${artboard.height}">`;
                    if (artboard.bgType === 'color') {
                        svgContent += `<rect width="100%" height="100%" fill="${artboard.bgColor}"/>`;
                    } else if (artboard.bgType === 'gradient') {
                        svgContent += `<rect width="100%" height="100%" fill="${artboard.bgColor}"/>`;
                    }

                    layers.forEach(l => {
                        if (!l.visible) return;
                        const anchor = l.align === 'center' ? 'middle' : l.align === 'right' ? 'end' : 'start';
                        svgContent += `<text x="${l.x}" y="${l.y}" font-family="${l.fontFamily}" font-size="${l.fontSize}px" font-weight="${l.fontWeight}" fill="${l.color}" text-anchor="${anchor}" opacity="${l.opacity}" transform="rotate(${l.rotation} ${l.x} ${l.y}) scale(${l.scaleX}, ${l.scaleY})">${l.text}</text>`;
                    });

                    svgContent += `</svg>`;

                    const blob = new Blob([svgContent], { type: 'image/svg+xml;charset=utf-8' });

                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${projectName}.svg`;
                    a.click();

                    setShowExportModal(false);
                    return;

                canvas.width = targetW;
                canvas.height = targetH;

                ctx.scale(multiplier, multiplier);

                if (artboard.bgType === 'color') {
                    ctx.fillStyle = artboard.bgColor;
                    ctx.fillRect(0, 0, artboard.width, artboard.height);
                } else if (artboard.bgType === 'gradient') {
                    const grad = ctx.createLinearGradient(0, 0, artboard.width, artboard.height);
                    grad.addColorStop(0, artboard.bgColor);
                    grad.addColorStop(1, '#1e1b4b');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, artboard.width, artboard.height);
                } else if (format === 'jpg') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, artboard.width, artboard.height);
                }

                await document.fonts.ready;

                layers.forEach(l => {
                    if (!l.visible) return;

                    ctx.save();
                    ctx.translate(l.x, l.y);
                    ctx.rotate((l.rotation * Math.PI) / 180);
                    ctx.scale(l.scaleX, l.scaleY);
                    ctx.globalAlpha = l.opacity;

                    ctx.font = `${l.fontWeight} ${l.fontSize}px "${l.fontFamily}", sans-serif`;
                    ctx.fillStyle = l.color;
                    ctx.textAlign = l.align;
                    ctx.textBaseline = 'middle';
                    ctx.fillText(l.text, 0, 0);
                    ctx.restore();
                });

                if (format === 'png' || format === 'jpg') {
                    const mime = format === 'jpg' ? 'image/jpeg' : 'image/png';
                    const dataUrl = canvas.toDataURL(mime, 0.95);

                                <script>window.onload = () => { window.print(); window.close(); };<\/script>

                    setSelectedLayerId(layer.id);
                    setIsEditingInline(true);
                    lastTapRef.current = { time: 0, layerId: null };

                                                    </span>
                                                </div>
                                                <button 
                                                    onClick={(e) => deleteProjectFromDB(proj.id, e)}
                                                    className="p-2 text-red-400 hover:bg-red-500/20 rounded-xl"
                                                >
                                                    <i className="fas fa-trash text-xs"></i>
                                                </button>
                                            </div>
                                        ))
                                    )}
                                </div>

                                <button 
                                    onClick={() => setShowProjectsModal(false)}
                                    className="w-full py-2.5 rounded-xl bg-slate-700 text-white text-xs font-semibold"
                                >
                                    بستن
                                </button>
                            </div>
                        </div>
                    )}

                    {showExportModal && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-md">
                            <div className={`w-full max-w-sm p-6 rounded-3xl shadow-2xl border ${
                                isDarkMode ? 'glass-panel-dark border-white/10' : 'glass-panel-light border-slate-200'
                            }`}>
                                <div className="flex justify-between items-center mb-4">
                                    <h3 className="font-bold text-base flex items-center gap-2">
                                        <i className="fas fa-file-export text-emerald-400"></i>
                                        خروجی گرفتن از طرح
                                    </h3>
                                    <button onClick={() => setShowExportModal(false)} className="p-1 hover:text-red-400">
                                        <i className="fas fa-xmark text-base"></i>
                                    </button>
                                </div>

                                <div className="space-y-3 mb-6">
                                    <div className="p-3 rounded-2xl border border-white/10 space-y-2">
                                        <span className="font-bold text-xs opacity-90">تصویر PNG با کیفیت بالا</span>
                                        <div className="grid grid-cols-3 gap-2">
                                            <button onClick={() => exportDesign('png', 1)} className="py-2 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 text-xs font-medium border border-indigo-500/40">1x (اصلی)</button>
                                            <button onClick={() => exportDesign('png', 2)} className="py-2 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 text-xs font-medium border border-indigo-500/40">2x (Retina)</button>
                                            <button onClick={() => exportDesign('png', 3)} className="py-2 rounded-xl bg-indigo-600/30 hover:bg-indigo-600 text-xs font-medium border border-indigo-500/40">3x (Ultra)</button>
                                        </div>
                                    </div>

                                    <button onClick={() => exportDesign('jpg', 2)} className="w-full py-3 rounded-2xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-500/40 text-amber-200 text-xs font-semibold flex items-center justify-center gap-2">
                                        <i className="fas fa-image"></i>
                                        <span>دانلود JPG (با پس‌زمینه)</span>
                                    </button>

                                    <button onClick={() => exportDesign('svg', 1)} className="w-full py-3 rounded-2xl bg-emerald-500/20 hover:bg-emerald-500/30 border border-emerald-500/40 text-emerald-200 text-xs font-semibold flex items-center justify-center gap-2">
                                        <i className="fas fa-bezier-curve"></i>
                                        <span>خروجی برداری SVG</span>
                                    </button>

                                    <button onClick={() => exportDesign('pdf', 2)} className="w-full py-3 rounded-2xl bg-rose-500/20 hover:bg-rose-500/30 border border-rose-500/40 text-rose-200 text-xs font-semibold flex items-center justify-center gap-2">
                                        <i className="fas fa-file-pdf"></i>
                                        <span>خروجی سند PDF</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // Mount React application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'khatavar-v1';
                    self.addEventListener('install', (e) => {
                        self.skipWaiting();
                    });
                    self.addEventListener('fetch', (e) => {
                        e.respondWith(
                            caches.match(e.request).then((res) => res || fetch(e.request))
                        );
                    });
                `;
                const blob = new Blob([swCode], { type: 'text/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }
    </script>
</body>
</html>
